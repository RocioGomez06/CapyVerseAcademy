<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Pedagogy — CapyVerse Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#232323;--bg-2:#2e2e2e;--orange:#E69F00;--sky:#56B4E9;--green:#009E73;--yellow:#F0E442;--white:#F0EEE4;--gray:#666;--win-hi:#4a4a4a;--win-sh:#111}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--white);font-family:'Pixelify Sans',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;gap:2rem}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:9}
    img{width:80px;height:80px;image-rendering:pixelated;filter:drop-shadow(0 0 14px var(--orange))}
    .win-box{background:var(--bg-2);border-top:2px solid var(--win-hi);border-left:2px solid var(--win-hi);border-right:2px solid var(--win-sh);border-bottom:2px solid var(--win-sh);max-width:520px;width:100%}
    .titlebar{background:linear-gradient(90deg,#004a7c,var(--sky));padding:5px 10px;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--white);letter-spacing:1px;display:flex;align-items:center;gap:6px}
    .body{padding:2.5rem 2rem}
    h1{font-family:'Press Start 2P',monospace;font-size:clamp(11px,2.5vw,16px);color:var(--orange);line-height:1.6;margin-bottom:1rem}
    p{font-size:18px;color:var(--gray);margin-bottom:1.5rem}
    .cursor{display:inline-block;width:10px;height:16px;background:var(--yellow);vertical-align:middle;animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    a{font-family:'Press Start 2P',monospace;font-size:8px;background:var(--orange);color:var(--bg);padding:10px 18px;text-decoration:none;border-top:2px solid #ffc84a;border-left:2px solid #ffc84a;border-right:2px solid #8a5e00;border-bottom:2px solid #8a5e00;letter-spacing:1px;transition:filter .1s;display:inline-block}
    a:hover{filter:brightness(1.2)}
    a:focus{outline:2px solid var(--yellow);outline-offset:3px}
  </style>
</head>
